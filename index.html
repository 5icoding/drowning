<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>链接导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            padding: 40px;
            text-align: center;
        }
        
        header {
            margin-bottom: 40px;
        }
        
        h1 {
            color: #4a4a4a;
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .subtitle {
            color: #777;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .link-card {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
        }
        
        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }
        
        .link-card:hover::before {
            left: 100%;
        }
        
        .link-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }
        
        .link-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
            font-size: 1.8rem;
            color: white;
        }
        
        .drowning .link-icon {
            background: linear-gradient(135deg, #36d1dc, #5b86e5);
        }
        
        .habitica .link-icon {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        }
        
        .link-content {
            flex: 1;
            text-align: left;
        }
        
        .link-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #4a4a4a;
        }
        
        .link-description {
            color: #777;
            font-size: 0.95rem;
        }
        
        .link-arrow {
            color: #aaa;
            font-size: 1.5rem;
            transition: transform 0.3s;
        }
        
        .link-card:hover .link-arrow {
            transform: translateX(5px);
            color: #6e8efb;
        }
        
        footer {
            margin-top: 40px;
            color: #888;
            font-size: 0.9rem;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .link-card {
                flex-direction: column;
                text-align: center;
            }
            
            .link-icon {
                margin-right: 0;
                margin-bottom: 15px;
            }
            
            .link-content {
                text-align: center;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>应用导航</h1>
            <p class="subtitle">选择您想要访问的应用</p>
        </header>
        
        <div class="links-container">
            <a href="drowning.html" class="link-card drowning">
                <div class="link-icon">🌊</div>
                <div class="link-content">
                    <h2 class="link-title">Drowning</h2>
                    <p class="link-description">沉浸式体验应用，探索水下世界的神秘与美丽</p>
                </div>
                <div class="link-arrow">→</div>
            </a>
            
            <a href="habitica.html" class="link-card habitica">
                <div class="link-icon">⚔️</div>
                <div class="link-content">
                    <h2 class="link-title">Habitica</h2>
                    <p class="link-description">将生活游戏化，通过完成任务提升角色等级的应用</p>
                </div>
                <div class="link-arrow">→</div>
            </a>
        </div>
        
        <footer>
            <p>© 2023 应用导航 | 精心设计，为您提供最佳体验</p>
        </footer>
    </div>
</body>
</html>
