<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玩家任务与成就系统</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link  rel="stylesheet" href="style.css" type="text/css"/> 
    <script src="data.js"></script> 
</head>     
<body>
<div id="app">
    <h1>{{title}}</h1>
    <div style="clear:both;"></div>
    <div id="container">
        <div id="left-panel">
            <div>
            <span>{{isGameLevelCurrentTitle}}</span>
            <span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
            <button @click="solve">解决</button>
            </div>
            <!-- <div v-if ="isGameLevelCurrentTitle == 'Nothing'">
                <div>   
                    
                </div>
            </div>   -->
            <!-- <div v-for = "item in isGameLevel.content">
                <div>   
                    <div v-if ="item.type == 'titleTask'">
                        <span>{{item.title}}</span> 
                        <span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
                        <button @click="solve">解决</button>    
                 </div>
            </div>   -->

            
        </div>
        <div id="right-panel">
            <h3>玩家状态</h3>
            <div class="status-grid">
                <div class="status-item">
                    <span class="status-label">希望(Hope):</span>
                    <span class="status-value">{{Hope}}</span>
                </div>
                <div class="status-item">
                    <span class="status-label">生命(Life):</span>
                    <span class="status-value">{{Life}}</span>
                </div>
                <div class="status-item">
                    <span class="status-label">身体(Body):</span>
                    <span class="status-value">{{Body}}</span>
                </div>
                <div class="status-item">
                    <span class="status-label">爱情(Love):</span>
                    <span class="status-value">{{Love}}</span>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<script>
    solve_str = "<button id='solve' @click='solve'>解决</button>";
    const app = Vue.createApp({ 
        data() {
            return {    
                title: 'Drowning',
                gameTime: 0,
                playerHealth: 100,
                playerEnergy: 100,
                isGameLevel: Nothing_level,
                isGameLevelCount:0,
                isGameLevelCurrent:1,
                isGameLevelCurrentTitle:"",
                isGameRunning: false,
                Hope: 0,
                Life: 0,
                Body: 0,
                Love: 0
            }   
        },
        methods: {
            judgment() {
                resourse = this.isGameLevel.data[this.isGameLevelCurrent.toString()].resourse
                console.log(resourse)
                operation = this.isGameLevel.data[this.isGameLevelCurrent.toString()].operation
                eval("this."+ resourse + "= " +"this." +resourse +operation) 
                this.isGameLevelCurrent++;
                if(this.isGameLevelCurrent > this.isGameLevel.count) {
                    this.isGameLevelCurrent = 1
                }
                
            },
            solve() {
                //alert('解决')
                this.judgment()
                this.gameTick()
            },
            gameTick() {
                // 游戏时间递增
                this.gameTime++;
                this.isGameLevelCount = this.isGameLevel.count
                this.isGameLevelCurrentTitle = this.isGameLevel.data[this.isGameLevelCurrent.toString()].title
                
                //document.getElementById("left-panel").innerHTML = doStr
                console.log(this.gameTime+" "+this.isGameLevelCurrentTitle)
            }
        },
        mounted() {
            this.gameTick()
        },
        beforeUnmount() {
        }
    })
    app.mount('#app')
</script>
</html>
