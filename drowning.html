<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玩家任务与成就系统</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link  rel="stylesheet" href="style.css" type="text/css"/>   
</head>     
<body>
<div id="app">
    <h1>{{title}}</h1>
    <div style="clear:both;"></div>
    <div id="container">
        <div id="left-panel">
            <div>
            <span>{{isGameLevelCurrentTitle}}</span>
            <span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
            <button @click="solve">解决</button>
            </div>
            
        </div>
        <div id="right-panel">
            <h3>玩家状态</h3>
            <div class="status-grid">
                <div class="status-item">
                    <span class="status-label">希望(Hope):</span>
                    <span class="status-value">{{Hope}}</span>
                </div>
                <div class="status-item">
                    <span class="status-label">生命(Life):</span>
                    <span class="status-value">{{Life}}</span>
                </div>
                <div class="status-item">
                    <span class="status-label">身体(Body):</span>
                    <span class="status-value">{{Body}}</span>
                </div>
                <div class="status-item">
                    <span class="status-label">爱情(Love):</span>
                    <span class="status-value">{{Love}}</span>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<script>
    Nothing_level={
        "count": 4,
        "content":{
            "1": {
                "level": 1,
                "title":"空无一物",
                "resourse":"Hope",
                "operation":"+0"
            },
            "2": {
                "level": 2, 
                "title":"你尚未存在 +希望",
                "resourse":"Hope",
                "operation":"+1"
            },
            "3": {
                "level": 3,
                "title":"你开始形成 +身体",
                "resourse":"Body",
                "operation":"+1"      
            },
            "4": {
                "level": 4,
                "title":"你存在了 +生命",
                "resourse":"Life",
                "operation":"+1"
            }
        }
    }

    solve_str = "<button id='solve' @click='solve'>解决</button>";
    const app = Vue.createApp({ 
        data() {
            return {    
                title: 'Drowning',
                gameTime: 0,
                playerHealth: 100,
                playerEnergy: 100,
                isGameLevel: Nothing_level,
                isGameLevelCount:0,
                isGameLevelCurrent:1,
                isGameLevelCurrentTitle:"",
                isGameRunning: false,
                Hope: 0,
                Life: 0,
                Body: 0,
                Love: 0
            }   
        },
        methods: {
            judgment() {
                resourse = this.isGameLevel.content[this.isGameLevelCurrent.toString()].resourse
                console.log(resourse)
                operation = this.isGameLevel.content[this.isGameLevelCurrent.toString()].operation
                eval("this."+ resourse + "= " +"this." +resourse +operation) 
                this.isGameLevelCurrent++;
                //this.Hope += 1
                
            },
            solve() {
                //alert('解决')
                this.judgment()
                this.gameTick()
            },
            gameTick() {
                // 游戏时间递增
                this.gameTime++;
                this.isGameLevelCount = this.isGameLevel.count
                this.isGameLevelCurrentTitle = this.isGameLevel.content[this.isGameLevelCurrent.toString()].title
                
                //document.getElementById("left-panel").innerHTML = doStr
                console.log(this.gameTime+" "+this.isGameLevelCurrentTitle)
            }
        },
        mounted() {
            this.gameTick()
        },
        beforeUnmount() {
        }
    })
    app.mount('#app')
</script>
</html>
